services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: automusic
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: automusic
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automusic"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://automusic:local-development-only@postgres:5432/automusic
      AUTOMUSIC_DATA_DIR: /app/data
    volumes:
      - audio-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://automusic:local-development-only@postgres:5432/automusic
      AUTOMUSIC_DATA_DIR: /app/data
    volumes:
      - audio-data:/app/data
    depends_on:
      api:
        condition: service_healthy
  analysis-worker:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    command: ["python", "-m", "app.analysis_jobs"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://automusic:local-development-only@postgres:5432/automusic
      AUTOMUSIC_DATA_DIR: /app/data
    volumes:
      - audio-data:/app/data
    depends_on:
      api:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
  audio-data:
